<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Spentra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#F5F7F6;--tx:#1D1D1D;--mut:#6b7280;--bd:#e3e8e5;--g:#25D162;--gd:#128a40;--red:#E5484D;--side:#f1f5f3;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:8px}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.btn{border:1px solid var(--bd);background:var(--bg);padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s}
.btn:hover{background:var(--card)}.pri{background:var(--g);border-color:var(--g);color:#1D1D1D;font-weight:600}.pri:hover{background:#1fbd58}
.ib{width:34px;height:34px;padding:0;position:relative}
input,select{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-top:6px}
label{font-size:12px;font-weight:600;display:block;margin-top:14px}
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.lp{background:#1D1D1D;color:#fff;padding:32px 40px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:.14em}.logo i{background:var(--g);color:#1D1D1D;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.big{font-size:clamp(34px,5vw,54px);font-weight:700;line-height:1.1;letter-spacing:-.02em}.big b{color:var(--g)}
.mini{background:#2B2B2B;border-radius:12px;padding:16px;font-size:13px}
.rp{display:flex;align-items:center;justify-content:center;padding:32px;position:relative}.rp>div{width:100%;max-width:318px}
.tabs{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin:18px 0 4px}.tabs button{border:0;border-radius:0;background:var(--bg);padding:7px 12px;font-size:12px;font-weight:500}.tabs button.on{background:var(--g);color:#1D1D1D;font-weight:600}
.sm{font-size:11px;color:var(--mut)}.lk{color:var(--gd);text-decoration:underline;font-size:12px;background:none;border:0;padding:0}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
.nav{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;width:100%;color:var(--tx)}.nav.on{background:rgba(37,209,98,.18);font-weight:600}.nav:hover{background:rgba(37,209,98,.1)}
main{padding:0 28px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--bd);margin-bottom:22px;gap:10px}
h1{font-size:20px}h2{font-size:15px}.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.k{font-size:11.5px;color:var(--mut)}.v{font-size:22px;font-weight:700;margin:6px 0 2px}.gr{color:var(--gd)}.rd{color:var(--red)}
.bd{font-size:11px;border:1px solid;border-radius:5px;padding:2px 7px;font-weight:500;display:inline-block}.ok{color:var(--gd);border-color:var(--g)}.no{color:var(--red);border-color:var(--red)}
.tr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.tr:last-child{border:0}.tr>div:nth-child(2){flex:1;min-width:0}
.ti{width:32px;height:32px;border:1px solid var(--bd);border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.pb{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g);transition:width .6s}
.ln{display:flex;justify-content:space-between;padding:7px 0}
.sub{display:flex;gap:0;margin-bottom:10px;flex-wrap:wrap}.sub button{border:1px solid var(--bd);background:var(--bg);padding:5px 10px;font-size:12px;border-radius:0}.sub button.on{background:var(--g);color:#1D1D1D;font-weight:600}.sub button:first-child{border-radius:6px 0 0 6px}.sub button:last-child{border-radius:0 6px 6px 0}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:16px}.modal>form,.modal>div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.pop{position:absolute;right:0;top:42px;width:300px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;border-radius:8px;padding:1px 5px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.hm div{aspect-ratio:1;border-radius:6px;border:1px solid var(--bd);padding:4px;font-size:11px}
.bn{display:none}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1D1D1D;color:#fff;border-radius:8px;padding:10px 16px;z-index:40;display:none;font-size:13px;max-width:90vw}
svg text{fill:var(--mut);font-family:Inter,sans-serif}
@media(max-width:860px){.login{grid-template-columns:1fr}.lp{display:none}.shell{grid-template-columns:1fr}.side{display:none}main{padding:0 14px 90px}.g3,.g2{grid-template-columns:1fr}.g3.stat{grid-template-columns:1fr 1fr}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--side);border-top:1px solid var(--bd);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}.bn button{flex:1 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 2px;color:var(--mut)}.bn button.on{color:var(--gd);font-weight:600}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const I={dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',tx:'<path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/>',an:'<path d="M3 3v18h18M7 15v-4M12 15V7M17 15v-6"/>',bud:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',goal:'<path d="M5 21V4M5 4h13l-2 4 2 4H5"/>',score:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>',moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',plus:'<path d="M12 5v14M5 12h14"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',dn:'<path d="M12 5v14M19 12l-7 7-7-7"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',play:'<path d="M7 4l13 8-13 8z"/>',logo:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',tr:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem={};const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
let S=(()=>{try{return JSON.parse(store.get('spentra'))}catch(e){return null}})()||{user:null,tx:[],goals:[],rules:{},notes:[],theme:null};
const save=()=>store.set('spentra',JSON.stringify(S));
const SYM={INR:'₹',USD:'$',EUR:'€'};
const cur=()=>SYM[S.user?.currency||'INR'];
const f=n=>(n<0?'-':'')+cur()+Math.abs(Math.round(n)).toLocaleString('en-IN');
const CATS=['Food & Dining','Groceries','Shopping','Transportation','Entertainment','Subscriptions','Healthcare','Education','Bills & Utilities','Travel','Random UPI Transfers','Other Expenses','Uncategorized UPI Payment'];
const COL={'Food & Dining':'#25D162','Groceries':'#12a4a0','Shopping':'#F2A93B','Transportation':'#4aa8e0','Entertainment':'#e0679a','Subscriptions':'#c06b3c','Healthcare':'#e5484d','Education':'#7b8cde','Bills & Utilities':'#63cdf0','Travel':'#8fb339','Random UPI Transfers':'#999','Other Expenses':'#555','Uncategorized UPI Payment':'#999'};
const ESS=['Groceries','Transportation','Healthcare','Education','Bills & Utilities'];
const KW={'Food & Dining':['swiggy','zomato','coffee','cafe','restaurant','dominos','mcdonald','kfc'],Groceries:['blinkit','zepto','bigbasket','instamart','dmart'],Shopping:['amazon','flipkart','myntra','ajio'],Transportation:['uber','ola','rapido','metro','irctc'],Entertainment:['bookmyshow','pvr','inox'],Subscriptions:['netflix','spotify','prime','hotstar','youtube'],Healthcare:['pharmeasy','apollo','1mg','hospital','clinic'],Education:['udemy','coursera','byju','school'],'Bills & Utilities':['electric','airtel','jio','broadband','recharge','bescom','rent'],Travel:['makemytrip','goibibo','indigo','airbnb']};
function cat(m){const k=m.toLowerCase().trim();if(S.rules[k])return S.rules[k];for(const c in KW)if(KW[c].some(w=>k.includes(w)))return c;return'Uncategorized UPI Payment'}
const sd=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()),dk=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=d=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'}),ft=d=>new Date(d).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
function cx(){const u=S.user,now=new Date(),t0=sd(now),st=sd(new Date(u.start)),days=Math.max(0,Math.round((t0-st)/864e5)),ci=Math.floor(days/30);const cs=new Date(st);cs.setDate(st.getDate()+ci*30);const ce=new Date(cs);ce.setDate(cs.getDate()+30);const dn=days-ci*30+1;const daily=u.income/30;
const ok=S.tx.filter(x=>x.status==='Completed'&&x.type!=='Self transfer');const inC=x=>{const t=new Date(x.ts);return t>=cs&&t<ce};const ct=ok.filter(inC);
const spent=ct.filter(x=>x.type==='Expense').reduce((a,x)=>a+x.a,0),other=ct.filter(x=>x.type!=='Expense').reduce((a,x)=>a+x.a,0);
const tk=dk(now),ts=ok.filter(x=>x.type==='Expense'&&dk(x.ts)===tk).reduce((a,x)=>a+x.a,0);
const prior=spent-ts;const avail=u.carry?Math.max(0,daily*dn-prior):daily;
return{now,cs,ce,dn,ci,daily,ok,ct,spent,other,ts,avail,rem:avail-ts,total:u.income+other,left:u.income+other-spent,st}}
function dayExp(d,list){return list.filter(x=>x.type==='Expense'&&dk(x.ts)===dk(d))}
function score(d,c){const e=dayExp(d,c.ok);if(!e.length)return null;const tot=e.reduce((a,x)=>a+x.a,0),disc=e.filter(x=>!ESS.includes(x.cat)).reduce((a,x)=>a+x.a,0),over=Math.max(0,tot-c.daily);const pen=Math.min(over,disc);return{s:Math.max(0,100-Math.round(pen/c.daily*100)),tot,disc,over,ess:tot-disc}}
const rate=s=>s>=90?'Excellent':s>=75?'Great':s>=60?'Good, but can improve':s>=40?'Needs attention':'Needs improvement';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function theme(t){document.documentElement.dataset.theme=t;S.theme=t;save()}
const tg=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark')+render();
theme(S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
async function H(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let mode='in',page='dash',tab='Daily',pop=false,sess=!!(store.get('spentra_s')||sessionStorage.getItem('spentra_s'));
function login(rem){sess=true;rem?store.set('spentra_s','1'):sessionStorage.setItem('spentra_s','1')}
function logout(){store.del('spentra_s');try{sessionStorage.removeItem('spentra_s')}catch(e){}sess=false;render()}
function authView(){const up=mode==='up';return`<div class="login"><section class="lp"><div class="logo"><i>${ic('logo',16)}</i>SPENTRA</div><div><div class="big">₹1,00,000<br>÷ 30 = <b>₹3,333</b><br>a day.</div><p style="color:#a3a8a5;margin-top:18px;font-size:16px">Know Your Money. Own Your Future.</p></div><div><div class="mini"><div class="row" style="justify-content:space-between"><span class="sm">TODAY</span><span class="bd ok">On track</span></div><div class="ln"><span>Spent</span><b>₹1,750</b></div><div class="pb" style="background:#444"><i style="width:53%"></i></div><div class="ln"><span>Remaining</span><b style="color:var(--g)">₹1,583</b></div></div><p class="sm row" style="margin-top:14px;gap:8px;color:#a3a8a5">${ic('lock',14)}Spentra never asks for bank passwords, UPI PINs or OTPs.</p><p class="sm row" style="margin-top:6px;gap:8px;color:#a3a8a5">${ic('shield',14)}Bank data comes only through a consent you can revoke.</p></div></section>
<section class="rp"><button class="btn ib" style="position:absolute;top:100px;right:max(32px,calc(50% - 160px))" onclick="tg()" aria-label="Toggle theme">${ic(document.documentElement.dataset.theme==='dark'?'sun':'moon',16)}</button><div><h1 style="font-size:24px;margin-top:70px">${up?'Create your account':'Welcome back'}</h1><p class="sm" style="font-size:13px;margin-top:6px">${up?'Set your monthly income to get your daily budget.':'Sign in to see what is left of today.'}</p>
<div class="tabs"><button class="${up?'':'on'}" onclick="mode='in';render()">Sign in</button><button class="${up?'on':''}" onclick="mode='up';render()">Create account</button></div>
<form onsubmit="auth(event)">${up?`<label>Full name<input id="n" required maxlength="60"></label>`:''}<label>Email address<input id="e" type="email" required maxlength="120"></label><label>Password<input id="p" type="password" required minlength="${up?8:1}"></label>
${up?`<label>Monthly income<input id="i" type="number" min="1" step="any" required></label><label>Currency<select id="cu"><option>INR</option><option>USD</option><option>EUR</option></select></label>`:''}
<div class="ln" style="margin-top:6px"><label class="row" style="margin:0;font-weight:400"><input id="r" type="checkbox" checked style="width:auto;margin:0"> Remember me</label><button type="button" class="lk" onclick="toast('Password reset needs an email service. Sign in on a device that has your account.')">Forgot password?</button></div>
<p id="err" class="rd sm" role="alert" style="min-height:16px"></p><button class="btn pri" style="width:100%;padding:11px">${up?'Create account':'Sign in'}</button></form>
<div class="sm" style="text-align:center;margin:14px 0">or</div><button class="btn" style="width:100%" onclick="toast('Google sign-in needs OAuth credentials from your backend.')"><b style="border:1px solid var(--bd);border-radius:3px;font-size:9px;padding:0 3px">G</b>Sign in with Google</button><button class="btn" style="width:100%;margin-top:8px" onclick="enterDemo()">${ic('play',12)}Explore the demo account</button>
<p class="sm" style="margin-top:14px">Demo mode keeps accounts on this device only. Passwords are salted and hashed before they are stored, and no bank is contacted.</p></div></section></div>`}
async function auth(ev){ev.preventDefault();const g=i=>$('#'+i)?.value.trim(),e=g('e').toLowerCase(),p=$('#p').value,err=m=>$('#err').textContent=m;
if(mode==='up'){if(S.user)return err('An account already exists on this device. Sign in instead.');const inc=parseFloat(g('i'));if(!(inc>0))return err('Enter a monthly income above 0.');const salt=crypto.randomUUID();S.user={name:g('n'),email:e,salt,hash:await H(p,salt),income:inc,currency:g('cu'),start:dk(new Date()),carry:false,warn:true};save();login($('#r').checked);page='dash';render()}
else{if(!S.user)return err('No account yet. Create one first.');if(S.user.email!==e||S.user.hash!==await H(p,S.user.salt))return err('Email or password is incorrect.');login($('#r').checked);render()}}
function enterDemo(){if(!S.user){S.user={name:'Demo user',email:'demo@spentra.app',salt:'d',hash:'',income:100000,currency:'INR',start:dk(new Date()),carry:false,warn:true};save()}else if(S.user.hash)return toast('Sign in with your account. This device holds a single account.');login(true);render()}
const NAV=[['dash','Dashboard'],['tx','Transactions'],['an','Analytics'],['bud','Daily Budget'],['goal','Savings Goals'],['score','Financial Score'],['cal','Calendar'],['set','Settings']];
const TT={dash:'Dashboard',tx:'Transactions',an:'Analytics',bud:'Daily Budget',goal:'Savings Goals',score:'Financial Score',cal:'Calendar',set:'Settings'};
function notify(m){S.notes.unshift({m,t:Date.now(),r:0});S.notes=S.notes.slice(0,40)}
function daily(c){const k=dk(c.now);S.u2=S.u2||{};if(S.u2.m!==k){S.u2.m=k;notify(`Good morning. Your daily budget is ${f(c.daily)}. Have a financially productive day.`);save()}if(c.now.getHours()>=21&&S.u2.n!==k){S.u2.n=k;notify('Your daily financial report is ready. Check your spending and financial score.');save()}}
function render(){if(!sess||!S.user){$('#app').innerHTML=authView();return}const c=cx();daily(c);const un=S.notes.filter(n=>!n.r).length;const pg={dash,tx,an,bud,goal,score:sc,cal,set}[page](c);
$('#app').innerHTML=`<div class="shell"><aside class="side"><div class="logo" style="padding:4px 8px 16px"><i>${ic('logo',16)}</i>SPENTRA</div>${NAV.map(n=>`<button class="nav ${page===n[0]?'on':''}" onclick="go('${n[0]}')">${ic(n[0])}${n[1]}</button>`).join('')}<div style="margin-top:auto;border-top:1px solid var(--bd);padding:12px 8px" class="row"><div style="flex:1;min-width:0"><b>${esc(S.user.name)}</b><div class="sm" style="overflow:hidden;text-overflow:ellipsis">${esc(S.user.email)}</div></div><button class="btn ib" onclick="logout()" aria-label="Sign out">${ic('out',15)}</button></div></aside>
<main><div class="top"><h1>${TT[page]}</h1><div class="row"><button class="btn pri" onclick="addM()">${ic('plus',15)}Add payment</button><div style="position:relative"><button class="btn ib" onclick="pop=!pop;render()" aria-label="Notifications">${ic('bell',16)}${un?`<span class="dot">${un}</span>`:''}</button>${pop?`<div class="pop"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>Notifications</b><button class="lk" onclick="S.notes.forEach(n=>n.r=1);save();render()">Mark read</button></div>${S.notes.length?S.notes.slice(0,8).map(n=>`<div style="padding:8px 0;border-top:1px solid var(--bd);${n.r?'color:var(--mut)':''}">${esc(n.m)}<div class="sm">${ft(n.t)}</div></div>`).join(''):'<div class="sm">Nothing yet.</div>'}</div>`:''}</div><button class="btn ib" onclick="tg()" aria-label="Toggle theme">${ic(document.documentElement.dataset.theme==='dark'?'sun':'moon',16)}</button></div></div>${pg}</main></div>
<nav class="bn">${NAV.map(n=>`<button class="${page===n[0]?'on':''}" onclick="go('${n[0]}')">${ic(n[0],20)}${n[1].split(' ').pop()}</button>`).join('')}</nav>`}
function go(p){page=p;pop=false;render();scrollTo(0,0)}
const stat=(k,v,s,cl='')=>`<div class="c"><div class="k">${k}</div><div class="v ${cl}">${v}</div><div class="sm">${s}</div></div>`;
function ring(c,sz=210){const used=c.avail>0?Math.min(1,c.ts/c.avail):(c.ts>0?1:0),R=sz/2-14,C=2*Math.PI*R,over=c.rem<0;return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img" aria-label="Remaining ${f(c.rem)}"><circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="var(--bd)" stroke-width="18"/><circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="${over?'#E5484D':'#25D162'}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C*used} ${C}" transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:stroke-dasharray .8s"/><text x="50%" y="42%" text-anchor="middle" font-size="11">${over?'OVER BY':'REMAINING'}</text><text x="50%" y="55%" text-anchor="middle" font-size="30" font-weight="700" style="fill:var(--tx)">${f(Math.abs(c.rem))}</text><text x="50%" y="66%" text-anchor="middle" font-size="11">${Math.round(used*100)}% of ${f(c.avail)} used</text></svg>`}
function bySt(c){const s=c.ts>c.avail?['Over budget','no']:c.ts>=.8*c.avail&&c.ts>0?['Near limit','no']:['On track','ok'];return`<span class="bd ${s[1]}">${s[0]}</span>`}
function donut(c){const ex=c.ct.filter(x=>x.type==='Expense'),m={};ex.forEach(x=>{const k=x.cat==='Uncategorized UPI Payment'?'Random UPI Transfers':x.cat;m[k]=(m[k]||0)+x.a});const en=Object.entries(m).sort((a,b)=>b[1]-a[1]),R=70,C=2*Math.PI*R;let acc=0;
const seg=en.map(([k,v])=>{const l=v/c.spent*C,s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${COL[k]}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`;acc+=l;return s}).join('');
return`<div class="row" style="gap:20px;flex-wrap:wrap"><svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--bd)" stroke-width="26"/>${seg}<text x="100" y="96" text-anchor="middle" font-size="10">Spent</text><text x="100" y="116" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--tx)">${f(c.spent)}</text></svg><div style="flex:1;min-width:150px">${en.length?en.map(([k,v])=>`<div class="ln" style="padding:4px 0"><span class="row"><i style="width:10px;height:10px;border-radius:3px;background:${COL[k]}"></i>${k}</span><b>${f(v)}</b></div>`).join(''):'<div class="sm">No spending in this cycle yet.</div>'}</div></div>`}
function bars(lb,a,b,col,line){const W=600,H=230,m=Math.max(...a,...(b||[]),line||0,1),n=lb.length,bw=W/n;const y=v=>190-v/m*170;let s=[0,.5,1].map(t=>`<text x="0" y="${y(m*t)+4}" font-size="10">${m*t>=1000?Math.round(m*t/1000)+'k':Math.round(m*t)}</text><line x1="34" x2="${W}" y1="${y(m*t)}" y2="${y(m*t)}" stroke="var(--bd)"/>`).join('');
a.forEach((v,i)=>{const w=b?bw*.34:bw*.6,x=34+(W-34)/n*i+((W-34)/n-(b?w*2+3:w))/2;s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${190-y(v)}" rx="2" fill="${col?col(v):'#25D162'}"/>`;if(b)s+=`<rect x="${x+w+3}" y="${y(b[i])}" width="${w}" height="${190-y(b[i])}" rx="2" fill="#E5484D"/>`;s+=`<text x="${34+(W-34)/n*(i+.5)}" y="208" font-size="10" text-anchor="middle">${esc(lb[i])}</text>`});
if(line)s+=`<line x1="34" x2="${W}" y1="${y(line)}" y2="${y(line)}" stroke="var(--mut)" stroke-dasharray="4 4"/>`;return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Spending chart">${s}</svg>`}
function trend(c,t){const days=n=>Array.from({length:n},(_,i)=>{const d=new Date(sd(c.now));d.setDate(d.getDate()-(n-1-i));return d});
const sum=(l,fn)=>l.filter(fn).reduce((a,x)=>a+x.a,0);
if(t==='Daily'){const ds=days(14);return bars(ds.map(d=>d.getDate()),ds.map(d=>sum(c.ok,x=>x.type==='Expense'&&dk(x.ts)===dk(d))),0,v=>v>c.daily?'#E5484D':'#25D162',c.daily)}
if(t==='Weekly'){const w=Array.from({length:8},(_,i)=>{const e=new Date(sd(c.now));e.setDate(e.getDate()-i*7+1);const s=new Date(e);s.setDate(e.getDate()-7);return{l:fd(s),v:sum(c.ok,x=>x.type==='Expense'&&new Date(x.ts)>=s&&new Date(x.ts)<e)}}).reverse();return bars(w.map(x=>x.l),w.map(x=>x.v),0,()=>'#25D162')}
if(t==='Monthly'){const w=Array.from({length:6},(_,i)=>{const d=new Date(c.now.getFullYear(),c.now.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,1);return{l:d.toLocaleDateString('en-IN',{month:'short'}),v:sum(c.ok,x=>x.type==='Expense'&&new Date(x.ts)>=d&&new Date(x.ts)<e)}}).reverse();return bars(w.map(x=>x.l),w.map(x=>x.v),0,()=>'#25D162')}
if(t==='Category'){const m={};c.ct.filter(x=>x.type==='Expense').forEach(x=>m[x.cat]=(m[x.cat]||0)+x.a);const e=Object.entries(m);return e.length?bars(e.map(x=>x[0].split(' ')[0]),e.map(x=>x[1]),0,()=>'#25D162'):''}
const ds=days(7);return bars(ds.map(d=>d.getDate()),ds.map(d=>sum(c.ok,x=>x.type!=='Expense'&&dk(x.ts)===dk(d))),ds.map(d=>sum(c.ok,x=>x.type==='Expense'&&dk(x.ts)===dk(d))))}
function chart(c){const t=['Daily','Weekly','Monthly','Category','Income vs spend'];const any=c.ok.length;return`<div class="sub">${t.map(x=>`<button class="${tab===x?'on':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}</div>${any?trend(c,tab)||'<div class="empty">No expenses this cycle.</div>':'<div class="empty">Charts appear after your first payment.</div>'}`}
function rows(l){return l.length?l.map(x=>{const ex=x.type==='Expense';return`<div class="tr"><div class="ti ${ex?'rd':'gr'}">${ic(ex?'up':'dn',15)}</div><div><b>${esc(x.m)}</b><div class="sm">${x.type==='Self transfer'?'Own transfer':esc(x.cat)} · ${fd(x.ts)}, ${ft(x.ts)} · ${x.method}</div></div><div style="text-align:right"><b class="${ex?'rd':'gr'}" style="${x.status==='Failed'?'text-decoration:line-through;opacity:.6':''}">${ex?'-':'+'}${f(x.a)}</b><div><span class="bd ${x.status==='Completed'?'ok':'no'}">${x.status}</span></div></div></div>`}).join(''):'<div class="empty">No transactions yet. Add a payment to get started.</div>'}
function dash(c){const fmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),last=new Date(c.ce);last.setDate(last.getDate()-1),h=c.now.getHours(),gr=h<12?'morning':h<17?'afternoon':'evening';const sp=c.total?Math.round(c.left/c.total*100):0;const sc0=score(c.now,c);
return`<h2 style="font-size:20px">Good ${gr}, ${esc(S.user.name.split(' ')[0])}</h2><p class="sm" style="margin:4px 0 16px">Cycle day ${c.dn} of 30 · ${fmt(c.cs)} – ${fmt(last)}</p><div class="grid g3 stat">${stat('Monthly income',f(S.user.income),c.other?`plus ${f(c.other)} other income`:'Your base income')}${stat('Total money spent',f(c.spent),Math.round(c.spent/(c.total||1)*100)+'% of income')}${stat('Remaining monthly budget',f(c.left),30-c.dn+' days left in cycle')}${stat("Today's spending",f(c.ts),'Daily budget '+f(c.daily))}${stat("Today's remaining allowance",f(c.rem),f(c.avail)+' available today',c.rem<0?'rd':'gr')}${stat('Savings percentage',sp+'%',f(c.left)+' kept so far')}</div>
<div class="grid g2" style="margin-top:14px"><div class="c"><div class="row" style="justify-content:space-between"><h2>Today's spending</h2>${bySt(c)}</div><div style="display:grid;place-items:center;padding:14px">${ring(c)}</div><div class="ln"><span>Daily budget</span><b>${f(c.daily)}</b></div><div class="ln"><span>Spent</span><b class="rd">${f(c.ts)}</b></div><div class="ln"><span>Remaining</span><b class="gr">${f(c.rem)}</b></div><button class="nav" style="justify-content:space-between;border-top:1px solid var(--bd);border-radius:0" onclick="go('score')"><span class="sm">Discipline score today</span><b class="gr">${sc0?sc0.s+'/100 '+rate(sc0.s).split(',')[0]:'No spending yet'}</b></button></div>
<div class="c"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Expense breakdown</h2><span class="sm">This cycle</span></div>${donut(c)}</div></div>
<div class="grid g2" style="margin-top:14px;grid-template-columns:1.5fr 1fr"><div class="c"><h2 style="margin-bottom:10px">Spending trends</h2>${chart(c)}</div><div class="c"><div class="row" style="justify-content:space-between"><h2>Recent transactions</h2><button class="lk" onclick="go('tx')">View all</button></div>${rows([...S.tx].sort((a,b)=>b.ts-a.ts).slice(0,7))}</div></div>`}
let fl='All';
function tx(c){let l=[...S.tx].sort((a,b)=>b.ts-a.ts);if(fl!=='All')l=l.filter(x=>fl==='Income'?x.type==='Income'||x.type==='Refund':x.type===fl);
return`<div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap"><div class="sub" style="margin:0">${['All','Expense','Income','Self transfer'].map(x=>`<button class="${fl===x?'on':''}" onclick="fl='${x}';render()">${x}</button>`).join('')}</div><button class="btn" onclick="csv()">${ic('dl',15)}Export CSV</button></div><div class="c">${l.length?l.map(x=>`<div class="tr"><div class="ti ${x.type==='Expense'?'rd':'gr'}">${ic(x.type==='Expense'?'up':'dn',15)}</div><div><b>${esc(x.m)}</b><div class="sm">${fd(x.ts)}, ${ft(x.ts)} · ${x.method} · ${x.type}</div>${x.type!=='Self transfer'?`<select aria-label="Category" style="width:auto;padding:4px 8px;margin-top:6px;font-size:12px" onchange="recat('${x.id}',this.value)">${CATS.map(k=>`<option ${k===x.cat?'selected':''}>${k}</option>`).join('')}</select>`:''}</div><div style="text-align:right"><b class="${x.type==='Expense'?'rd':'gr'}">${x.type==='Expense'?'-':'+'}${f(x.a)}</b><div><span class="bd ${x.status==='Completed'?'ok':'no'}">${x.status}</span></div><button class="btn ib" style="margin-top:6px" onclick="del('${x.id}')" aria-label="Delete">${ic('tr',14)}</button></div></div>`).join(''):'<div class="empty">No transactions yet. Add a payment to get started.</div>'}</div>`}
function recat(id,k){const x=S.tx.find(t=>t.id===id);x.cat=k;S.rules[x.m.toLowerCase().trim()]=k;save();render();toast('Category saved. Future payments to '+x.m+' will use it.')}
function del(id){S.tx=S.tx.filter(t=>t.id!==id);save();render()}
function csv(){const r=[['Date','Time','Merchant','Type','Category','Method','Status','Amount']].concat(S.tx.map(x=>[dk(x.ts),ft(x.ts),x.m,x.type,x.cat,x.method,x.status,x.a]));const t=r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='spentra-transactions.csv';a.click()}
function an(c){const m={};c.ct.filter(x=>x.type==='Expense').forEach(x=>m[x.cat]=(m[x.cat]||0)+x.a);const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);
return`<div class="grid g2"><div class="c"><h2 style="margin-bottom:12px">Category-wise spending</h2>${e.length?e.map(([k,v])=>`<div style="margin-bottom:12px"><div class="ln" style="padding:0 0 4px"><span>${k}</span><b>${f(v)} · ${Math.round(v/c.spent*100)}%</b></div><div class="pb"><i style="width:${v/c.spent*100}%;background:${COL[k]}"></i></div></div>`).join(''):'<div class="empty">No spending in this cycle yet.</div>'}</div><div class="c"><h2 style="margin-bottom:10px">Income vs expenditure</h2>${c.ok.length?trend(c,'Income vs spend'):'<div class="empty">Appears after your first payment.</div>'}<p class="sm">Green: income, red: expenses, last 7 days.</p></div></div><div class="c" style="margin-top:14px"><h2 style="margin-bottom:10px">Daily expenditure</h2>${c.ok.length?trend(c,'Daily'):'<div class="empty">Appears after your first payment.</div>'}</div>`}
function bud(c){const hist=[];for(let i=0;i<c.ci;i++){const s=new Date(c.st);s.setDate(s.getDate()+i*30);const e=new Date(s);e.setDate(s.getDate()+30);const l=c.ok.filter(x=>new Date(x.ts)>=s&&new Date(x.ts)<e);hist.push({s,e,sp:l.filter(x=>x.type==='Expense').reduce((a,x)=>a+x.a,0)})}
return`<div class="grid g2"><div class="c" style="text-align:center"><h2 style="text-align:left">Today</h2><div style="display:grid;place-items:center;padding:10px">${ring(c)}</div>${bySt(c)}</div><div class="c"><h2>Budget cycle</h2><div class="ln"><span>Daily budget (income ÷ 30)</span><b>${f(c.daily)}</b></div><div class="ln"><span>Available today</span><b>${f(c.avail)}</b></div><div class="ln"><span>Spent today</span><b class="rd">${f(c.ts)}</b></div><div class="ln"><span>Remaining today</span><b class="gr">${f(c.rem)}</b></div><div class="ln"><span>Cycle day</span><b>${c.dn} of 30</b></div><div class="pb" style="margin:6px 0 12px"><i style="width:${c.dn/30*100}%"></i></div><div class="ln"><span>Monthly balance left</span><b>${f(c.left)}</b></div><label class="row" style="font-weight:400"><input type="checkbox" style="width:auto;margin:0" ${S.user.carry?'checked':''} onchange="S.user.carry=this.checked;save();render()"> Carry unused daily allowance forward</label></div></div><div class="c" style="margin-top:14px"><h2>Previous cycles</h2>${hist.length?hist.reverse().map(h=>`<div class="ln"><span>${fd(h.s)} – ${fd(h.e-864e5)}</span><b>${f(h.sp)} spent</b></div>`).join(''):'<div class="sm" style="margin-top:8px">History appears when your first 30-day cycle ends. A new cycle starts on its own, and transactions are never reset.</div>'}</div>`}
function goal(){return`<form class="c row" style="gap:10px;flex-wrap:wrap;margin-bottom:14px" onsubmit="ag(event)"><input id="gn" placeholder="Goal, e.g. Emergency fund" required maxlength="40" style="flex:2;min-width:160px;margin:0"><input id="gt" type="number" min="1" placeholder="Target amount" required style="flex:1;min-width:120px;margin:0"><button class="btn pri">Create goal</button></form><div class="grid g2">${S.goals.length?S.goals.map((g,i)=>`<div class="c"><div class="ln" style="padding-top:0"><b>${esc(g.n)}</b><button class="btn ib" onclick="S.goals.splice(${i},1);save();render()" aria-label="Delete goal">${ic('x',14)}</button></div><div class="pb"><i style="width:${Math.min(100,g.s/g.t*100)}%"></i></div><div class="ln"><span>${f(g.s)} of ${f(g.t)}</span><b class="gr">${Math.round(Math.min(100,g.s/g.t*100))}%</b></div><div class="row"><input id="gs${i}" type="number" min="1" placeholder="Add amount" style="margin:0"><button class="btn" onclick="gs(${i})">Add</button></div></div>`).join(''):'<div class="c empty" style="grid-column:1/-1">No goals yet. Create one above.</div>'}</div>`}
function ag(e){e.preventDefault();S.goals.push({n:$('#gn').value.trim(),t:+$('#gt').value,s:0});save();render()}
function gs(i){const v=+$('#gs'+i).value;if(v>0){S.goals[i].s+=v;save();render()}}
function sc(c){const t=score(c.now,c);const hist=Array.from({length:7},(_,i)=>{const d=new Date(sd(c.now));d.setDate(d.getDate()-i);return{d,r:score(d,c)}});const act=hist.filter(h=>h.r);const avg=act.length?Math.round(act.reduce((a,h)=>a+h.r.s,0)/act.length):null;
return`<div class="grid g2"><div class="c"><h2>Today's score</h2>${t?`<div class="v" style="font-size:44px">${t.s}<span class="sm">/100</span></div><b class="gr">${rate(t.s)}</b><p style="margin-top:12px;line-height:1.5">You spent ${f(t.tot)} today against a ${f(c.daily)} daily budget. ${f(t.ess)} went to essentials, which are never penalised. ${t.over>0?`You went ${f(t.over)} over budget, and ${f(Math.min(t.over,t.disc))} of that counts against your score because it was spent on non-essentials.`:'You stayed within your daily budget.'}</p>`:'<div class="empty">Your score appears after your first expense today.</div>'}</div><div class="c"><h2>Last 7 days</h2><div class="ln"><span>Weekly average</span><b>${avg===null?'No data':avg+'/100'}</b></div>${hist.map(h=>`<div class="ln"><span>${fd(h.d)}</span><b>${h.r?h.r.s+'/100':'No spending'}</b></div>`).join('')}</div></div><div class="c" style="margin-top:14px"><h2>How scoring works</h2><p class="sm" style="margin-top:8px;line-height:1.6;font-size:13px">Each day starts at 100. Only spending above your daily budget lowers it, and only the part spent on non-essentials (food delivery, shopping, entertainment, subscriptions, unknown UPI). Groceries, transport, healthcare, education and bills are treated as necessities. 90–100 Excellent · 75–89 Great · 60–74 Good · 40–59 Needs attention · 0–39 Needs improvement.</p></div>`}
function cal(c){const y=c.now.getFullYear(),m=c.now.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();const sp=Array.from({length:n},(_,i)=>dayExp(new Date(y,m,i+1),c.ok).reduce((a,x)=>a+x.a,0)),mx=Math.max(...sp,1);
let cells='<div></div>'.repeat(first)+sp.map((v,i)=>`<div style="background:${v?`rgba(37,209,98,${.15+v/mx*.7})`:'var(--card)'}" title="${f(v)}"><b>${i+1}</b><div class="sm" style="color:inherit">${v?f(v):''}</div></div>`).join('');
let streak=0;for(let i=0;;i++){const d=new Date(sd(c.now));d.setDate(d.getDate()-i);if(d<c.st)break;if(dayExp(d,c.ok).length)break;streak++}
return`<div class="c"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>${c.now.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><span class="sm">Darker green means higher spending</span></div><div class="hm" style="margin-bottom:6px">${['S','M','T','W','T','F','S'].map(d=>`<span class="sm" style="text-align:center">${d}</span>`).join('')}</div><div class="hm">${cells}</div></div><div class="c" style="margin-top:14px"><h2>No-spend streak</h2><div class="v">${streak} day${streak===1?'':'s'}</div><div class="sm">Consecutive days without an expense, counting from today.</div></div>`}
function set(c){const sw=(k,l)=>`<label class="row" style="font-weight:400"><input type="checkbox" style="width:auto;margin:0" ${S.user[k]?'checked':''} onchange="S.user.${k}=this.checked;save()"> ${l}</label>`;
return`<div class="grid g2"><form class="c" onsubmit="ui(event)"><h2>Profile</h2><label>Full name<input id="sn" value="${esc(S.user.name)}" required maxlength="60"></label><label>Monthly income<input id="si" type="number" min="1" step="any" value="${S.user.income}" required></label><p class="sm" style="margin-top:6px">Income changes apply to daily budgets from now on. Past transactions stay unchanged.</p><button class="btn pri" style="margin-top:12px">Save changes</button></form><div class="c"><h2>Preferences</h2><div class="ln"><span>Theme</span><button class="btn" onclick="tg()">${document.documentElement.dataset.theme==='dark'?'Switch to light':'Switch to dark'}</button></div>${sw('warn','Warn me at 80% of my daily budget')}${sw('carry','Carry unused daily allowance forward')}<div style="margin-top:14px" class="row"><button class="btn" onclick="csv()">${ic('dl',15)}Export transactions</button></div></div></div><div class="c" style="margin-top:14px"><h2>Your data</h2><p class="sm" style="margin:8px 0 12px">Everything is stored on this device only.</p><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="if(confirm('Delete all transactions, goals and notifications?')){S.tx=[];S.goals=[];S.notes=[];S.u2={};save();render()}">Clear transactions</button><button class="btn rd" onclick="if(confirm('Delete your account and all data on this device?')){S={user:null,tx:[],goals:[],rules:{},notes:[],theme:S.theme};save();logout()}">Delete account</button><button class="btn" onclick="logout()">${ic('out',15)}Sign out</button></div></div>`}
function ui(e){e.preventDefault();S.user.name=$('#sn').value.trim();S.user.income=+$('#si').value;save();render();toast('Changes saved')}
function addM(){const d=document.createElement('div');d.className='modal';d.id='mod';const n=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
d.innerHTML=`<form onsubmit="addP(event)"><div class="row" style="justify-content:space-between"><h2>Add payment</h2><button type="button" class="btn ib" onclick="$('#mod').remove()" aria-label="Close">${ic('x',14)}</button></div><label>Type<select id="mt"><option>Expense</option><option>Income</option><option>Refund</option><option>Self transfer</option></select></label><label>Merchant or person<input id="mm" required maxlength="60" placeholder="e.g. Swiggy"></label><label>Amount (${cur()})<input id="ma" type="number" min="0.01" step="any" required></label><label>Category<select id="mc"><option value="">Detect automatically</option>${CATS.map(k=>`<option>${k}</option>`).join('')}</select></label><label>Method<select id="mp"><option>UPI</option><option>Card</option><option>Net banking</option><option>Cash</option></select></label><label>Status<select id="ms"><option>Completed</option><option>Failed</option></select></label><label>Date and time<input id="md" type="datetime-local" value="${n}" required></label><button class="btn pri" style="width:100%;margin-top:16px">Save payment</button></form>`;document.body.appendChild(d)}
function addP(e){e.preventDefault();const m=$('#mm').value.trim(),a=+$('#ma').value,t=$('#mt').value;if(!m||!(a>0))return;const x={id:crypto.randomUUID(),m,a,type:t,cat:$('#mc').value||cat(m),method:$('#mp').value,status:$('#ms').value,ts:new Date($('#md').value).getTime()};S.tx.push(x);
if(x.status==='Completed'&&t==='Expense'){const b=cx(),before=b.ts-(dk(x.ts)===dk(b.now)?a:0);if(dk(x.ts)===dk(b.now)){notify(`${f(a)} spent on ${m}. Your remaining daily allowance is ${f(b.rem)}.`);if(S.user.warn&&b.avail>0&&before<.8*b.avail&&b.ts>=.8*b.avail&&b.ts<=b.avail)notify('You have used 80% of your daily budget.');if(b.rem<0&&before<=b.avail)notify(`You have exceeded your daily budget by ${f(-b.rem)}.`)}}
save();$('#mod').remove();render();toast('Payment saved')}
render();
</script></body></html>
